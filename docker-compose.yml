version: "3.9"

# Langfuse — observabilidade local para o pipeline DSPy
# Acesse em: http://localhost:3010
#
# Uso:
#   docker compose up -d          # sobe em background
#   docker compose down           # para e remove containers
#   docker compose down -v        # para e remove containers + dados
#
# Após subir, crie uma conta em http://localhost:3010, gere as chaves de API
# e adicione ao .env:
#   LANGFUSE_PUBLIC_KEY=pk-lf-...
#   LANGFUSE_SECRET_KEY=sk-lf-...
#   LANGFUSE_HOST=http://localhost:3010

services:
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-tcc-nextauth-secret-dev}
      SALT: ${LANGFUSE_SALT:-tcc-salt-dev}
      NEXTAUTH_URL: http://localhost:3010
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data

volumes:
  langfuse_db:
    driver: local
